<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Destinations | Visit Lesotho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script>document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("theme") || "light");</script>
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">Visit Lesotho</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Open menu"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="destinations.html">Destinations</a></li>
            <li class="nav-item"><a class="nav-link" href="accommodation.html">Accommodation</a></li>
            <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item ms-lg-3"><button id="themeBtn" class="btn btn-outline-light btn-sm" type="button">Dark mode</button></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <section class="page-title">
      <div class="container">
        <h1>Destinations and activities</h1>
        <p class="mb-0">Find an outing by entering a name or choosing an activity type.</p>
      </div>
    </section>
    <section class="container py-5">
      <div class="row g-3 align-items-end mb-4">
        <div class="col-md-5">
          <label for="search" class="form-label">Find a place or activity</label>
          <input type="search" id="search" class="form-control" placeholder="For example: falls, pony, snow"></div>
        <div class="col-md-7">
          <div class="btn-group flex-wrap" id="filters">
          <button type="button" class="btn btn-outline-secondary active" data-filter="All">All</button>
          <button type="button" class="btn btn-outline-secondary" data-filter="Nature">Nature</button>
          <button type="button" class="btn btn-outline-secondary" data-filter="History">History</button>
          <button type="button" class="btn btn-outline-secondary" data-filter="Adventure">Adventure</button>
        </div>
      </div>
     </div>
      <p id="resultCount" aria-live="polite"></p>
      <div class="row g-4" id="cards">
      </div>
    </section>
  </main>
  <footer class="py-4">
    <div class="container">
      <p class="mb-0">&copy;2026 copyright.All Rights Reserved .</p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
