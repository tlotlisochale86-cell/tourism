<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | Visit Lesotho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script>document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("theme") || "light");</script>
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">Visit Lesotho</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Open menu"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto align-items-lg-center"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
            <li class="nav-item"><a class="nav-link" href="accommodation.html">Accommodation</a></li>
            <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item ms-lg-3">
              <button id="themeBtn" class="btn btn-outline-light btn-sm" type="button">Dark mode</button></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <section class="page-title">
      <div class="container">
        <h1>Photo gallery</h1>
        <p class="mb-0">Choose a photograph to view it larger, then browse the collection.</p>
      </div>
    </section>
    <section class="container py-5">
      <div class="row g-3">
        <figure class="col-6 col-md-4 m-0">
          <button type="button" class="gallery-item" data-index="0" aria-label="View larger: Maletsunyane Falls after rain">
            <img src="mal.jpg" alt="Maletsunyane Falls after rain" width="800" height="500">
          </button>
          <figcaption>Maletsunyane Falls after rain</figcaption>
        </figure>
        <figure class="col-6 col-md-4 m-0">
          <button type="button" class="gallery-item" data-index="1" aria-label="View larger: The view from Thaba-Bosiu">
            <img src="thaba.jpg" alt="The view from Thaba-Bosiu" width="800" height="500"></button>
            <figcaption>The view from Thaba-Bosiu</figcaption>
          </figure>
        <figure class="col-6 col-md-4 m-0">
          <button type="button" class="gallery-item" data-index="2" aria-label="View larger: Katse Dam at sunrise">
            <img src="download.jpg" alt="Katse Dam at sunrise" width="800" height="500"></button>
            <figcaption>Katse Dam at sunrise</figcaption>
          </figure>
        <figure class="col-6 col-md-4 m-0">
          <button type="button" class="gallery-item" data-index="3" aria-label="View larger: Sani Pass switchbacks">
            <img src="sani.jpg" alt="Sani Pass switchbacks" width="800" height="500"></button>
            <figcaption>Sani Pass switchbacks</figcaption></figure>
        <figure class="col-6 col-md-4 m-0">
          <button type="button" class="gallery-item" data-index="4" aria-label="View larger: Pony trek in the highlands">
            <img src="pony.jpg" alt="Pony trek in the highlands" width="800" height="500"></button>
            <figcaption>Pony trek in the highlands</figcaption>
          </figure>
        <figure class="col-6 col-md-4 m-0">
          <button type="button" class="gallery-item" data-index="5" aria-label="View larger: Skiing at Afriski">
            <img src="images.jpg" alt="Skiing at Afriski" width="800" height="500"></button>
            <figcaption>Skiing at Afriski</figcaption>
          </figure>
      </div>
    </section>
  </main>
  <footer>
    &copy;2026 copyright.All Rights Reserved.
  </footer>
  <div class="modal fade" id="photoModal" tabindex="-1" aria-labelledby="photoTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5" id="photoTitle"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <img id="modalImg" class="img-fluid rounded" src="" alt=""></div>
      <div class="modal-footer justify-content-between">
        <button type="button" class="btn btn-outline-secondary" id="prevBtn">Previous</button>
        <button type="button" class="btn btn-ochre" id="nextBtn">Next</button>
      </div>
    </div>
  </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
  <img src="">
</body>
</html>
